<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .surface-glass {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #7c3aed 0%, #aa0266 100%);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
        }
        .btn-gradient:active {
            transform: scale(0.95);
        }
        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content-wrapper {
            width: 100%;
            max-width: 480px;
            max-height: 95vh;
            overflow-y: auto;
            padding: 20px;
            transform: scale(0.95) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .modal-overlay.active .modal-content-wrapper {
            transform: scale(1) translateY(0);
        }
        .modal-content-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .modal-content-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .modal-content-wrapper::-webkit-scrollbar-thumb {
            background: #7c3aed;
            border-radius: 10px;
        }

        /* Background glow */
        .bg-glow-1 {
            position: absolute;
            top: 10%;
            left: 5%;
            width: 400px;
            height: 400px;
            background: rgba(124, 58, 237, 0.15);
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }
        .bg-glow-2 {
            position: absolute;
            bottom: 10%;
            right: 5%;
            width: 350px;
            height: 350px;
            background: rgba(170, 2, 102, 0.12);
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }

        /* Scrollbar hide for modal */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-bg-deep text-on-background font-body-base min-h-screen selection:bg-primary/30 selection:text-primary overflow-hidden">

<!-- ===== MODAL PEMBAYARAN ===== -->
<div class="modal-overlay active" id="payModal">
    <div class="modal-content-wrapper relative">
        <!-- Background Glow -->
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <!-- Payment Card -->
        <div class="surface-glass rounded-2xl p-6 md:p-8 flex flex-col items-center shadow-2xl relative z-10">
            
            <!-- Product Header -->
            <div class="text-center flex flex-col gap-1 mb-5 w-full">
                <p class="text-[10px] uppercase tracking-[0.15em] text-on-surface-variant font-bold">Payment Confirmation</p>
                <h3 id="mTitle" class="text-lg font-bold text-on-surface">Capcut 6 Bulan Individual Private</h3>
                <div class="mt-1">
                    <span id="mPrice" class="text-primary font-bold text-3xl tracking-tight">Rp 240,000</span>
                </div>
            </div>

            <!-- QR Container -->
            <div class="w-full max-w-[200px] mx-auto bg-white rounded-xl p-3 mb-4 shadow-lg relative group transition-transform duration-300 hover:scale-105">
                <div class="absolute inset-0 bg-primary/10 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <img src="/gambar/qris.jpeg" alt="QRIS" class="w-full h-auto object-contain rounded-lg" loading="lazy">
            </div>
            <p class="text-center text-sm text-on-surface-variant mb-5 font-medium">Scan QRIS untuk membayar</p>

            <!-- Transaction Details -->
            <div class="w-full bg-surface-container-low/80 rounded-xl p-4 flex flex-col gap-2.5 border border-white/5 backdrop-blur-sm">
                <div class="flex justify-between items-center pb-2 border-b border-white/5">
                    <span class="text-on-surface-variant text-sm">ID Trx:</span>
                    <span id="mTrxID" class="text-on-surface font-bold text-sm font-mono">#LS-1781636999794-631</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-on-surface-variant text-sm">Metode:</span>
                    <span class="text-on-surface font-medium text-sm">QRIS / Transfer Bank</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-on-surface-variant text-sm">Status:</span>
                    <span class="text-amber-400 font-bold text-sm flex items-center gap-1.5">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
                        </span>
                        Menunggu Pembayaran
                    </span>
                </div>
                <div class="mt-2 pt-3 border-t border-dashed border-white/10">
                    <div class="flex items-start gap-2">
                        <span class="material-symbols-outlined text-success-green text-sm mt-0.5">info</span>
                        <p class="text-success-green font-bold text-sm">Note: Kirim bukti bayar ke Admin</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex flex-col gap-3 w-full mt-5">
                <button class="btn-gradient text-white w-full py-3.5 rounded-xl font-bold text-base flex items-center justify-center gap-2" onclick="confirmWA()">
                    <span class="material-symbols-outlined text-xl">chat</span>
                    Konfirmasi WhatsApp
                </button>
                <button onclick="closeModal()" class="w-full py-2.5 text-on-surface-variant hover:text-primary transition-colors duration-200 font-medium flex items-center justify-center gap-1 group">
                    <span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
                    Kembali
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // ===== FUNGSI =====
    function showToast(msg, isError = false) {
        const t = document.getElementById('toast') || createToast();
        t.textContent = msg;
        t.style.background = isError ? '#ef4444' : 'linear-gradient(135deg, #7c3aed, #aa0266)';
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function createToast() {
        const t = document.createElement('div');
        t.id = 'toast';
        t.style.cssText = `
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            color: white; padding: 12px 24px; border-radius: 50px;
            font-weight: 700; z-index: 3000; display: none;
            pointer-events: none; font-size: 0.85rem; white-space: nowrap;
            background: linear-gradient(135deg, #7c3aed, #aa0266);
        `;
        document.body.appendChild(t);
        return t;
    }

    // Ambil data dari URL atau localStorage (contoh)
    let productData = {
        name: 'Capcut 6 Bulan Individual Private',
        price: 240000,
        id: 1
    };

    // Bisa diisi dari localStorage atau API
    // const saved = localStorage.getItem('checkoutProduct');
    // if (saved) productData = JSON.parse(saved);

    document.getElementById('mTitle').innerText = productData.name;
    document.getElementById('mPrice').innerText = `Rp ${productData.price.toLocaleString()}`;
    document.getElementById('mTrxID').innerText = '#LS-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

    function confirmWA() {
        const trx = document.getElementById('mTrxID').innerText;
        const msg = `Halo Admin *CyberVault*\nSaya ingin konfirmasi pembelian:\n\n*📦 Produk*: ${productData.name}\n*💰 Harga:* Rp ${productData.price.toLocaleString()}\n*🆔 ID Transaksi*: ${trx}\n\nBerikut bukti pembayaran yang telah saya lakukan:`;
        window.open(`https://wa.me/6285810630431?text=${encodeURIComponent(msg)}`, '_blank');
        showToast('Pesanan berhasil! Stok telah dikurangi.');
    }

    function closeModal() {
        document.getElementById('payModal').classList.remove('active');
        // Optional: redirect atau reload
        setTimeout(() => {
            window.location.href = '/';
        }, 300);
    }

    // ===== INTERAKSI KARTU QR =====
    document.querySelector('.surface-glass')?.addEventListener('mousemove', (e) => {
        const card = e.currentTarget;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 40;
        const rotateY = (centerX - x) / 40;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.querySelector('.surface-glass')?.addEventListener('mouseleave', (e) => {
        e.currentTarget.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
    });

    // ===== KEYBOARD ESC =====
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // ===== CLICK OUTSIDE =====
    document.getElementById('payModal')?.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });
</script>
